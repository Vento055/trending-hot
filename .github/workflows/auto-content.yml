name: Auto Content Pipeline

on:
  schedule:
    # 每天 UTC 09:00（北京 17:00）自动执行
    - cron: '0 9 * * *'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write

jobs:
  fetch-generate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-chat

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Create output directories
        run: |
          mkdir -p data/trends
          mkdir -p data/articles
          mkdir -p content/drafts
          mkdir -p src/content/signals
          mkdir -p logs

      # ── Step 1: Discover trends (Google Trends RSS + Reddit + HN → signals.json) ──
      - name: Discover Trends
        run: npx tsx scripts/discover-trends.ts
        continue-on-error: true

      # ── Step 2: Generate articles (signals.json → data/articles/*.json) ──
      - name: Generate Articles
        run: npx tsx scripts/generate-articles.ts
        continue-on-error: true

      # ── Step 3: Fetch Google Trends data (pytrends → data/trends/*.json) ──
      - name: Fetch Trends Data
        run: python scripts/fetch_trends.py --all-categories --limit 10
        continue-on-error: true

      # ── Step 4: Generate content drafts (data/trends/*.json → content/drafts/*.md) ──
      - name: Generate Content Drafts
        run: |
          for f in data/trends/*_$(date +%Y%m%d).json; do
            if [ -f "$f" ]; then
              python scripts/generate_content.py --input "$f" --all || true
            fi
          done
        continue-on-error: true

      # ── Step 5: Build check (ensure no broken pages) ──
      - name: Build verification
        run: npm run build
        continue-on-error: true

      # ── Step 6: Commit and push (triggers Vercel auto-deploy) ──
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: content update $(date -u '+%Y-%m-%d %H:%M') UTC

            - Discover trends from Google Trends / Reddit / HN
            - Generate article JSON via DeepSeek
            - Fetch pytrends data
            - Generate content drafts
            
            Generated by GitHub Actions workflow"
            git push
          fi

      - name: Summary
        run: |
          echo "=== Pipeline Summary ==="
          echo "Articles in data/articles/:"
          ls -1 data/articles/ 2>/dev/null | wc -l
          echo "Trend data in data/trends/:"
          ls -1 data/trends/ 2>/dev/null | wc -l
          echo "Drafts in content/drafts/:"
          ls -1 content/drafts/ 2>/dev/null | wc -l
          echo "Signals in data/signals.json:"
          cat data/signals.json 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('signals',[])))" 2>/dev/null || echo "N/A"
          echo ""
          echo "Vercel will auto-deploy from the pushed commit."
